{% load static %}
{% load crispy_forms_tags %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'musicapp/css/theme.css' %}">
    <title>MoodyTunes — Sign In</title>
</head>
<body class="mt-auth-shell">
    <div class="mt-auth-card">
        <div class="mt-auth-art">
            <img src="{% static 'musicapp/img/record.gif' %}" alt="Record player">
        </div>
        <div class="mt-auth-form">
            <form method="post">
                <h2>Sign In</h2>
                {% csrf_token %}
                {{form|crispy}}
                <input type="submit" value="Sign In">
                <p class="signup">Don't have an account? <a href="{% url 'signup' %}">Sign Up.</a></p>
            </form>
        </div>
    </div>
</body>
</html>
