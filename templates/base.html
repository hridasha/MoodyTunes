{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="{% static 'musicapp/css/theme.css' %}">
    <script src="{% static 'musicapp/js/player.js' %}"></script>
    <title>MoodyTunes{% block title %}{% endblock title %}</title>
    {% block header %}{% endblock header %}
</head>
<body>
    <nav class="mt-rail">
        <img class="mt-logo" src="{% static 'musicapp/img/logohp.jpeg' %}" alt="MoodyTunes">
        <ul class="mt-rail-links">
            <li><a href="{% url 'search' %}" class="{% if request.path == '/search/' %}active{% endif %}" title="Search"><i class="fa fa-search"></i></a></li>
            <li><a href="{% url 'index' %}" class="{% if request.path == '/' %}active{% endif %}" title="Home"><i class="fa fa-home"></i></a></li>
            <li><a href="{% url 'mymusic' %}" class="{% if request.path == '/mymusic/' %}active{% endif %}" title="My Music"><i class="fa fa-music"></i></a></li>
            <li><a href="{% url 'cam' %}" class="{% if request.path == '/cam/' %}active{% endif %}" title="Mood Camera"><i class="fa fa-camera"></i></a></li>
            <li><a href="{% url 'spotify_hub' %}" class="{% if request.path == '/spotify/' %}active{% endif %}" title="Spotify"><i class="fa fa-spotify"></i></a></li>
            {% if request.user.is_active %}
            <li><a href="{% url 'logout' %}" title="Log out"><i class="fa fa-sign-out"></i></a></li>
            {% else %}
            <li><a href="{% url 'login' %}" title="Log in"><i class="fa fa-sign-in"></i></a></li>
            <li><a href="{% url 'signup' %}" title="Sign up"><i class="fa fa-user-plus"></i></a></li>
            {% endif %}
        </ul>
    </nav>

    <main class="mt-body">
    {% block body %}
    {% block content %}
    {% endblock content %}
    {% endblock body %}
    </main>

    <footer id="mt-player-bar">
        <img id="mt-player-image" src="" alt="">
        <div class="mt-player-meta">
            <span id="mt-player-song"></span>
            <span id="mt-player-artist"></span>
        </div>
        <div class="mt-player-controls">
            <button type="button" id="mt-prev" class="mt-player-btn" title="Previous"><i class="fa fa-step-backward"></i></button>
            <button type="button" id="mt-playpause" class="mt-player-btn mt-player-btn-main" title="Play/Pause"><i class="fa fa-play" id="mt-playpause-icon"></i></button>
            <button type="button" id="mt-next" class="mt-player-btn" title="Next"><i class="fa fa-step-forward"></i></button>
        </div>
        <div class="mt-player-progress">
            <span id="mt-time-current" class="mt-time">0:00</span>
            <input type="range" id="mt-seek" min="0" max="100" value="0" step="0.1">
            <span id="mt-time-duration" class="mt-time">0:00</span>
        </div>
        <div class="mt-player-volume">
            <i class="fa fa-volume-up"></i>
            <input type="range" id="mt-volume" min="0" max="1" value="1" step="0.01">
        </div>
        <audio id="mt-audio"></audio>
    </footer>
</body>
</html>
