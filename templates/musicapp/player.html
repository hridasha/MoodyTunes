{% extends 'base.html' %}
{% load static %}
{% block title %} Player {% endblock title %}
{% block body %}

<div style="display:flex; flex-direction:column; align-items:center; margin-top: 40px;">
  <img src="{{songs.image.url}}" alt="{{songs.name}}"
       style="width:320px; height:320px; object-fit:cover; border-radius:16px; box-shadow: 0 0 0 3px var(--current-mood-color), 0 24px 60px rgba(0,0,0,0.5);">
  <h1 style="font-family: var(--font-display); margin: 24px 0 4px 0;">{{songs.name}}</h1>
  <p style="color: var(--text-muted); font-family: var(--font-mono);">{{songs.artist}}</p>
</div>

{{ song_json|json_script:"song-data" }}
<script>
  MTPlayer.playSong(JSON.parse(document.getElementById('song-data').textContent));
</script>
{% endblock body %}
