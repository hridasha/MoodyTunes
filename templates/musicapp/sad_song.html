{% extends 'base.html' %}
{% load static %}
{% block title %} Sad Songs {% endblock title %}
{% block body %}

<section class="mt-hero mt-hero--sad">
  <h3>Sad Songs</h3>
  <div class="mt-rule"></div>
</section>

{% if sad_song %}
<p>
  <button type="button" class="mt-btn mt-btn-primary" onclick="mtPlayAll()">Play All</button>
  <button type="button" class="mt-btn" onclick="mtShuffle()">Shuffle</button>
</p>
{% endif %}

{% include 'musicapp/_song_grid.html' with songs=sad_song %}

{{ songs_json|json_script:"songs-data" }}
<script>
  function mtPlayAll() {
    var songs = JSON.parse(document.getElementById('songs-data').textContent);
    MTPlayer.playQueue(songs, 0);
  }
  function mtShuffle() {
    var songs = JSON.parse(document.getElementById('songs-data').textContent);
    MTPlayer.playQueue(MTPlayer.shuffleQueue(songs), 0);
  }
</script>
{% endblock body %}
