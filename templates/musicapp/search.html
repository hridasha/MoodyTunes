{% extends 'base.html' %}
{% load static %}
{% block title %} Search {% endblock title %}
{% block body %}

<form class="mt-filter-bar" method="get" action="">
  <input type="text" class="mt-input" name="q" value="{{ request.GET.q }}" placeholder="Search songs">
  <button type="submit" class="mt-btn mt-btn-primary">Search</button>
</form>

{% if query_search %}
<section class="mt-hero">
  <h3>Results</h3>
  <div class="mt-rule"></div>
</section>
{% include 'musicapp/_song_grid.html' %}
{% endif %}

{% endblock body %}
